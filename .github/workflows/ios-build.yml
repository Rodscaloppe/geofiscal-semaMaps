name: iOS Build (KMP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-shared-framework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Build shared KMP framework for iOS
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Upload shared framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosArm64/releaseFramework/

  build-ios-app:
    runs-on: macos-latest
    needs: build-shared-framework
    steps:
      - uses: actions/checkout@v4

      - name: Download shared framework
        uses: actions/download-artifact@v4
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosArm64/releaseFramework/

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App (Debug - no signing)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Create dummy .env
        run: cp .env.example .env

      - name: Build Android APK (Debug)
        run: ./gradlew :app:assembleDebug

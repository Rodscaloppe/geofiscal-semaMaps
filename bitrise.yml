format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: ios

workflows:
  primary:
    summary: Build KMP shared framework e iOS App
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Compilar Framework KMP (Kotlin Multiplatform)
        inputs:
        - content: |
            chmod +x gradlew
            ./gradlew :shared:linkReleaseFrameworkIosArm64
    - xcode-archive@5:
        title: Xcode Build & Archive
        inputs:
        - project_path: iosApp/iosApp.xcodeproj
        - scheme: iosApp
        - distribution_method: development
        - configuration: Debug
        - automatic_code_signing: 'off'
    - deploy-to-bitrise-io@2:
        inputs:
        - notify_user_groups: none

  run_tests:
    summary: Build e testes
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Compilar Framework KMP (Kotlin Multiplatform)
        inputs:
        - content: |
            chmod +x gradlew
            ./gradlew :shared:linkReleaseFrameworkIosArm64
    - xcode-archive@5:
        title: Xcode Build & Archive
        inputs:
        - project_path: iosApp/iosApp.xcodeproj
        - scheme: iosApp
        - distribution_method: development
        - configuration: Debug
        - automatic_code_signing: 'off'
    - deploy-to-bitrise-io@2:
        inputs:
        - notify_user_groups: none

workflows:
  ios-testflight:
    name: GeoFiscal SEMA - iOS TestFlight
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 21
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        APP_STORE_APPLE_ID: 1234567890 # ID numérico do seu app no App Store Connect
    scripts:
      - name: Set permissions
        script: chmod +x gradlew

      - name: Configurar Assinatura Automática (Code Signing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.aistudio.geofiscal.sema" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build KMP Shared Framework
        script: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Build e Empacotar IPA
        script: |
          cd iosApp
          xcode-project build-ipa \
            --project iosApp.xcodeproj \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY # Chave configurada na integração
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true  # Envia direto para o TestFlight!
        beta_groups:
          - "Fiscais SEMA"          # Grupo de testadores no TestFlight
